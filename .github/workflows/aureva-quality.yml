name: AUREVA quality checks

on:
  push:
    branches:
      - feat/premium-motion-ui-20261020
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aureva-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: FastAPI / Auth / Evidence / Ledger
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.5.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated tests (SQLite, no production credentials)
        env:
          AUREVA_ORIGIN: http://127.0.0.1:8001
          AUREVA_SECURE_COOKIE: '0'
        run: python -m pytest tests -q
  ui-build:
    name: React / TypeScript / Vite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: TypeScript check and build
        run: npm --prefix frontend run build
  browser-smoke:
    name: Desktop / Mobile browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.5.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run build
      - name: Check actual desktop and mobile UI
        env:
          AUREVA_ORIGIN: http://127.0.0.1:8001
          AUREVA_SECURE_COOKIE: '0'
        run: python tests/ui_smoke.py
      - name: Upload design review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aureva-design-preview
          path: work/aureva-*.png
          if-no-files-found: ignore
          retention-days: 7
